name: CI Quality Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code quality checks (run in parallel)
  php-static-analysis:
    name: PHP Static Analysis
    uses: ./.github/workflows/static-analysis.yml
    secrets: inherit

  frontend-lint:
    name: Frontend Lint & Format
    uses: ./.github/workflows/lint-format.yml
    secrets: inherit

  # Sharded test runner: runs the Unit+Feature suite ONCE and uploads per-shard
  # coverage data for the coverage job to merge.
  fast-tests:
    name: Sharded Tests
    uses: ./.github/workflows/test-fast.yml
    secrets: inherit

  arch-tests:
    name: Arch Tests
    uses: ./.github/workflows/test-arch.yml
    secrets: inherit

  static-tests:
    name: Static Analysis Tests
    uses: ./.github/workflows/test-static.yml
    secrets: inherit

  # Coverage merge + gate: consumes the shard coverage data from `fast-tests` and
  # fails the PR if the combined line coverage is below the threshold. Runs after
  # the runner so the .cov artifacts exist.
  coverage-tests:
    name: Coverage Gate
    needs: [fast-tests]
    uses: ./.github/workflows/test-coverage.yml
    with:
      min: '100'
    secrets: inherit

  browser-tests:
    name: Browser Tests
    uses: ./.github/workflows/test-browser.yml
    secrets: inherit

  # Summary job that reports the overall status
  quality-gate-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-24.04
    needs: [php-static-analysis, frontend-lint, fast-tests, arch-tests, static-tests, coverage-tests, browser-tests]
    if: always()
    steps:
      - name: Generate summary
        run: |
          {
            echo "## 📊 CI Quality Gate Results"
            echo ""
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**PR:** #${{ github.event.pull_request.number }}"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "### Code Quality"
            echo "- PHP Static Analysis: ${{ needs.php-static-analysis.result }}"
            echo "- Frontend Lint & Format: ${{ needs.frontend-lint.result }}"
            echo ""
            echo "### Tests"
            echo "- Sharded Tests: ${{ needs.fast-tests.result }}"
            echo "- Arch Tests: ${{ needs.arch-tests.result }}"
            echo "- Static Analysis Tests: ${{ needs.static-tests.result }}"
            echo "- Coverage Gate: ${{ needs.coverage-tests.result }}"
            echo "- Browser Tests: ${{ needs.browser-tests.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check if quality gate passed
        if: |
          (needs.php-static-analysis.result == 'failure') ||
          (needs.frontend-lint.result == 'failure') ||
          (needs.fast-tests.result == 'failure') ||
          (needs.arch-tests.result == 'failure') ||
          (needs.static-tests.result == 'failure') ||
          (needs.coverage-tests.result == 'failure') ||
          (needs.browser-tests.result == 'failure')
        run: |
          echo "::error::Quality gate failed. Check the jobs above for details."
          exit 1
