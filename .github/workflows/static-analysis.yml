name: PHP Code Style & Analysis

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analysis:
    name: Pint, Rector & PHPStan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom, fileinfo, pgsql, zip, bcmath, gd, exif, intl
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=-1

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php85-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php85-composer-
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-ansi --no-progress --prefer-dist --optimize-autoloader

      # Run all three even if an earlier one fails, so every issue surfaces in a
      # single run. Each failing step still fails the job (if: !cancelled() only
      # controls whether the step runs, not whether its failure counts).
      - name: Run Pint (code style)
        run: vendor/bin/pint --test

      - name: Run Rector (dry-run)
        if: ${{ !cancelled() }}
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: Run PHPStan
        if: ${{ !cancelled() }}
        run: vendor/bin/phpstan analyse --error-format=github --memory-limit=1G
