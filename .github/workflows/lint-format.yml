name: Frontend Lint & Format

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: ESLint, Prettier & Types
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: latest
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pgsql, zip, bcmath, gd, exif, intl
          ini-values: memory_limit=2G
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-8.5-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-8.5-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Generates the Wayfinder route/action helpers (@/routes, @/actions) that the
      # gitignored TS imports rely on; without this the type check can't resolve them.
      - name: Build frontend
        run: pnpm build:ssr

      # Run all three even if an earlier one fails, so every issue surfaces in a
      # single run; each failing step still fails the job.
      - name: ESLint
        run: pnpm run lint:check

      - name: Prettier check
        if: ${{ !cancelled() }}
        run: pnpm run format:check

      - name: Type check (TS)
        if: ${{ !cancelled() }}
        run: pnpm run types:check
