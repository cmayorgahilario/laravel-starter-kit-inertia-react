# CodeRabbit Configuration for Laravel Starter Kit
# Laravel 13 · PHP 8.5 · Filament 5 · Inertia.js v3 + React 19 · Pest 4
# Postgres 18 · Valkey · Meilisearch · RustFS (S3) · Soketi · pnpm · Tailwind v4
# Reference: https://docs.coderabbit.ai/getting-started/yaml-configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Reviews and chat are written in English, aligned with the codebase, docs/ and
# visible UI text (all English by project convention).
language: 'en-US'

# Keep under 250 characters (schema limit). Detailed conventions live in path_instructions.
tone_instructions: 'Constructive, professional, technically accurate feedback on code quality and security. Respect project conventions: bounded-contexts, PHPStan max, 100% type-coverage, Pest, English-only code and UI.'

early_access: true

# =============================================================================
# REVIEWS
# =============================================================================

reviews:
  # Thorough feedback to match the strict quality bar (PHPStan max, 100% types).
  profile: 'assertive'

  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: false

  # Titles follow Conventional Commits in English.
  auto_title_instructions: |
    Generate a Conventional Commits title in English:
    1. Format: "type(scope): description" (e.g. "feat(security): ...", "fix(ucp): ...").
    2. Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.
    3. Description in English, imperative mood, lowercase start, no trailing period.
    4. Keep the whole title under 72 characters.
    5. Scope is the affected bounded-context or area (security, ucp, admin, auth, deps...).
    6. Examples:
       - "feat(security): add browser session management"
       - "fix(auth): correct 2FA recovery code expiration"
       - "refactor(admin): simplify Filament widget configuration"

  labeling_instructions:
    # Conventional Commit types
    - label: 'feat'
      instructions: 'New feature or capability.'
    - label: 'fix'
      instructions: 'Bug or error correction.'
    - label: 'docs'
      instructions: 'Changes under docs/, AGENTS.md, README or code comments.'
    - label: 'refactor'
      instructions: 'Code restructuring without behavior change.'
    - label: 'test'
      instructions: 'Adding or modifying Pest tests.'
    - label: 'chore'
      instructions: 'Maintenance, build config, dependencies.'
    - label: 'perf'
      instructions: 'Performance improvements.'
    - label: 'style'
      instructions: 'Formatting/style only (Pint, Prettier, ESLint).'

    # Technical layers (mapped to this stack)
    - label: 'backend'
      instructions: 'Laravel PHP changes (app/, config/, routes/, database/).'
    - label: 'frontend'
      instructions: 'Inertia + React + TypeScript changes (resources/js/).'
    - label: 'admin'
      instructions: 'Filament admin panel changes (app/Filament/, app/Providers/Filament/).'
    - label: 'auth'
      instructions: 'Authentication: Fortify, Sanctum, 2FA, passkeys/WebAuthn.'
    - label: 'database'
      instructions: 'Migrations, models, seeders, factories.'
    - label: 'ci/cd'
      instructions: 'GitHub Actions, lefthook, deployment.'

    # Special labels
    - label: 'security'
      instructions: 'Security vulnerability or hardening.'
    - label: 'breaking change'
      instructions: 'Backwards-incompatible change.'
    - label: 'dependencies'
      instructions: 'Composer or pnpm dependency updates.'

  # Exclude generated, vendored and non-source files.
  path_filters:
    - '!vendor/**'
    - '!node_modules/**'
    - '!storage/**'
    - '!bootstrap/cache/**'
    - '!bootstrap/ssr/**'
    - '!public/build/**'
    - '!public/hot'
    - '!public/storage/**'
    # Published vendor assets (compiled/minified; regenerated by Filament).
    - '!public/js/**'
    - '!public/css/**'
    - '!coverage/**'
    - '!.git/**'
    # Wayfinder generated helpers (regenerated by the Vite plugin).
    - '!resources/js/actions/**'
    - '!resources/js/routes/**'
    - '!resources/js/wayfinder/**'
    # shadcn base UI (regenerated; excluded from lint/format).
    - '!resources/js/components/ui/**'
    # Lockfiles and IDE/helper artifacts.
    - '!pnpm-lock.yaml'
    - '!composer.lock'
    - '!_ide_helper.php'
    - '!.phpactor.json'
    - '!*.log'
    - '!.env*'
    - '!.editorconfig'
    - '!.gitattributes'
    - '!.gitignore'

  path_instructions:
    # --- Laravel application (PHP 8.5 / Laravel 13) ---
    - path: 'app/**/*.php'
      instructions: |
        Review against Laravel 13 and PHP 8.5 best practices:
        - Code is organized by bounded-context (e.g. App\...\Security\...). New classes
          must live in the right context namespace, not in a flat structure.
        - Constructor property promotion; explicit type hints on every method, property,
          parameter and return type (the project enforces 100% type-coverage).
        - PHPStan at `max` level must pass — flag anything that would lower the bar or
          require ignore annotations.
        - Proper dependency injection; Eloquent relationships over manual queries; eager
          loading to avoid N+1.
        - Authorization via Gates/Policies. Validation via Form Request classes.
        - Use `declare(strict_types=1);` and final classes where appropriate.
        - English-only class names, comments and identifiers.

    - path: 'app/Models/**/*.php'
      instructions: |
        Eloquent models (organized by bounded-context, e.g. app/Models/Security/):
        - Use the casts() method, not the legacy $casts property.
        - Relationships declared with correct return types.
        - A matching factory exists under database/factories with the same namespace path.
        - Fillable/guarded set deliberately; scopes, accessors and mutators typed.
        - Sensitive fields hidden ($hidden) where relevant (this app handles auth data).

    - path: 'app/Actions/**/*.php'
      instructions: |
        Action classes (incl. Fortify actions under app/Actions/Security/...):
        - Single-responsibility, invokable or clearly named handle/execute method.
        - Fully typed; validation centralized; no business logic leaking into controllers.
        - For Fortify contracts (CreateNewUser, UpdateUserProfileInformation, etc.) keep
          the documented signatures and honor password/2FA/passkey policies.

    - path: 'app/Http/Controllers/**/*.php'
      instructions: |
        Controllers (Inertia + Sanctum SPA backend):
        - Form Request classes for validation (no inline validation).
        - Thin controllers that delegate to Actions/services.
        - Return Inertia responses for web; JSON for API endpoints.
        - Correct middleware, auth guards and authorization.

    - path: 'app/Http/Middleware/**/*.php'
      instructions: |
        Middleware:
        - Typed handle() signatures; minimal, focused responsibilities.
        - Be careful with Sanctum/Fortify ordering and session/cookie handling.

    - path: 'app/Filament/**/*.php'
      instructions: |
        Filament 5 admin panel (Resources, Pages, Widgets):
        - Follow Filament 5 APIs (schemas, forms, tables, actions) — not v3/v4 syntax.
        - Authorization on resources and actions; respect bounded-context boundaries.
        - Keep heavy logic in Actions/services, not in the Filament classes.

    - path: 'app/Providers/**/*.php'
      instructions: |
        Service providers (incl. Filament panel providers):
        - Register bindings/macros explicitly; avoid side effects at boot when avoidable.
        - Verify Fortify/Sanctum/Filament wiring matches the documented configuration.

    # --- Database ---
    - path: 'database/migrations/**/*.php'
      instructions: |
        Migrations for PostgreSQL 18:
        - Include ALL attributes when modifying a column (Postgres requires the full def).
        - Foreign keys, constraints and descriptive index names.
        - Reversible: provide a correct down() method.
        - Choose appropriate Postgres data types; consider impact on large tables.

    - path: 'database/factories/**/*.php'
      instructions: |
        Factories for Pest tests:
        - Mirror the model's bounded-context namespace (e.g. Security\UserFactory).
        - Realistic faker data that passes model casts/validation.
        - States for specific scenarios; relationships wired correctly.

    - path: 'database/seeders/**/*.php'
      instructions: |
        Seeders:
        - Idempotent where possible; use factories; safe to run in any environment used.

    # --- Tests (Pest 4, mirroring app/ by bounded-context) ---
    - path: 'tests/**/*.php'
      instructions: |
        Pest 4 tests (this project uses Pest, NOT raw PHPUnit classes):
        - Use the Pest functional API: test() (NOT it()), expect(), datasets, hooks.
        - tests/Unit and tests/Feature mirror the app/ bounded-context structure.
        - Test descriptions/titles and any infra comments are in English.
        - Prefer specific assertions (assertForbidden over assertStatus(403)).
        - Tests must be independent and deterministic.

    - path: 'tests/Feature/**/*.php'
      instructions: |
        Feature tests:
        - Exercise full HTTP endpoints, auth guards, roles and permissions.
        - Filament components tested with livewire() + a per-test loginAsUser() helper.
        - Use factories for setup; assert status codes and Inertia/JSON responses.

    - path: 'tests/Unit/**/*.php'
      instructions: |
        Unit tests:
        - Isolated logic, no external dependencies, fast and deterministic.

    - path: 'tests/Browser/**/*.php'
      instructions: |
        Browser tests (Pest 4 browser testing, SPA without SSR):
        - visit()->assertSee() directly is flaky in CI; insert ->wait(1) before the first
          read assertion to let React hydrate.
        - Keep selectors resilient; avoid timing assumptions beyond explicit waits.

    - path: 'tests/Arch/**/*.php'
      instructions: |
        Architecture tests:
        - Enforce bounded-context boundaries and project-wide rules (strict types,
          no debug statements, naming). Flag changes that weaken these guarantees.

    # --- Config ---
    - path: 'config/**/*.php'
      instructions: |
        Configuration files:
        - env() ONLY inside config files, never in application code.
        - Sensible defaults; remember real defaults: pgsql DB; cache/queue/session on
          database; SMTP mail (Mailpit); local filesystem disk; log broadcast driver.

    - path: 'routes/**/*.php'
      instructions: |
        Routes:
        - Named routes; correct middleware/guards. Wayfinder generates typed helpers from
          these — keep names stable and meaningful.

    # --- Frontend (Inertia v3 + React 19 + Tailwind v4) ---
    - path: 'resources/js/**/*.{ts,tsx}'
      instructions: |
        Inertia.js v3 + React 19 + TypeScript SPA:
        - All visible UI text is in English, hardcoded (no i18n).
        - Use Wayfinder route helpers (@/actions, @/routes) instead of hardcoded URLs.
        - For JSON requests use the project's useHttp hook (handles CSRF and 422), NOT
          raw fetch/axios.
        - Strong typing; `pnpm types:check` must pass. Follow ESLint/Prettier config.
        - Do NOT flag files under resources/js/components/ui (shadcn base, regenerated)
          or resources/js/{actions,routes,wayfinder} (Wayfinder generated).

    - path: 'resources/css/**/*.css'
      instructions: |
        Tailwind CSS v4:
        - Use v4 syntax/utilities and CSS variables (config-less setup, base-sera style).
        - Respect dark mode and the existing design tokens.

    # --- Tooling / infra ---
    - path: 'compose.yaml'
      instructions: |
        Laravel Sail / Docker services:
        - Expected services: Postgres 18, Valkey, Meilisearch, RustFS (S3), Mailpit, Soketi.
        - Verify networks, volumes and healthchecks stay consistent.

    - path: '{pint.json,phpstan.neon.dist,rector.php,eslint.config.js,prettier.config.js}'
      instructions: |
        Quality tooling config:
        - Do NOT lower PHPStan from `max` level or reduce the 100% type-coverage target.
        - Keep Pint, Rector, ESLint and Prettier settings consistent with project rules.

    - path: 'lefthook.yml'
      instructions: |
        Git hooks (run through Sail). Verify hook commands stay prefixed with
        ./vendor/bin/sail and that the push-to-master block is preserved.

    - path: '.github/**/*.{yml,yaml}'
      instructions: |
        GitHub Actions / CI:
        - Commands must run through Sail or a compatible PHP 8.5 / Node setup.
        - Keep the quality gates (Pest, PHPStan max, type-coverage, Pint, lint) intact.

    - path: 'docs/**/*.md'
      instructions: |
        Project documentation (English only):
        - Prefer short topic files with an index.md over long monolithic docs.
        - Keep docs in sync with code; no Spanish prose in docs/.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords: ['wip', 'draft', 'do not merge']
    labels: []
    base_branches: ['master', 'develop']
    ignore_usernames: ['dependabot']

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  pre_merge_checks:
    title:
      mode: 'error'
      requirements: 'Must follow Conventional Commits in English (feat:, fix:, docs:, refactor:, perf:, test:, build:, ci:, chore:, revert:), optionally scoped, e.g. "feat(security): ...".'
    description:
      mode: 'warning'
    docstrings:
      mode: 'warning'
      threshold: 80
    issue_assessment:
      mode: 'warning'

  tools:
    # PHP
    phpstan:
      enabled: true
      level: 'max'
    phpmd:
      enabled: true
    phpcs:
      enabled: false # Pint handles formatting; avoid duplicate/conflicting style noise.

    # JS / TS / CSS
    eslint:
      enabled: true
    biome:
      enabled: false
    oxc:
      enabled: false

    # General / infra
    ast-grep:
      essential_rules: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    hadolint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    dotenvLint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 120000
    languagetool:
      enabled: true
      level: 'default'
      disabled_categories: ['TYPOS', 'TYPOGRAPHY']

    # Not relevant to this stack
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    rubocop:
      enabled: false
    brakeman:
      enabled: false
    swiftlint:
      enabled: false
    golangci-lint:
      enabled: false
    clippy:
      enabled: false

# =============================================================================
# CHAT
# =============================================================================

chat:
  art: true
  auto_reply: true

# =============================================================================
# KNOWLEDGE BASE
# =============================================================================

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**/*.md'
      - '.junie/**/*.md'
      - 'README.md'
  learnings:
    scope: 'auto'
  issues:
    scope: 'auto'
  pull_requests:
    scope: 'auto'
  mcp:
    usage: 'auto'
    disabled_servers: []

# =============================================================================
# CODE GENERATION
# =============================================================================

code_generation:
  # IMPORTANT: code, comments, docstrings and test titles are English-only here,
  # even though human reviews/chat are in Spanish.
  docstrings:
    language: 'en-US'
    path_instructions:
      - path: 'app/**/*.php'
        instructions: |
          Generate PHPDoc in English:
          - Concise summary; @param/@return/@throws with accurate types.
          - Only add docblocks where they add value beyond the type hints
            (the project already enforces full native type-coverage).
      - path: 'tests/**/*.php'
        instructions: |
          Test docs in English; describe the behavior under test. Use Pest's test()
          functional style, not PHPUnit docblock annotations.

  unit_tests:
    path_instructions:
      - path: 'app/Models/**/*.php'
        instructions: |
          Generate Pest tests for models:
          - Use factories mirroring the bounded-context namespace.
          - Cover relationships, casts, scopes and accessors with test() + expect().
      - path: 'app/Actions/**/*.php'
        instructions: |
          Generate Pest feature tests for actions:
          - Cover happy path and validation/authorization failures.
          - Use factories; assert side effects and returned values.
      - path: 'app/Http/Controllers/**/*.php'
        instructions: |
          Generate Pest feature tests for controllers:
          - Exercise endpoints with different roles/permissions.
          - Assert Inertia/JSON responses and specific status codes.
